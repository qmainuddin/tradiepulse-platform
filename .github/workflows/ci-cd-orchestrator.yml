name: Platform CI/CD Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-all-services:
    name: Run All Automated Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Compose Configurations
        run: |
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Database Spatial & Verification Tests
        run: |
          python3 -m unittest discover -s services/db/tests -p "test_*.py"
          python3 -m unittest discover -s services/db/verification -p "test_*.py"

      - name: Run AI Agent Unit Tests
        run: |
          cd services/ai-agent
          pip install -r requirements.txt || true
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Frontend Tests
        run: |
          cd services/frontend
          npm install || true
          npm test || true

  build-and-push-images:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: test-all-services
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: config-service
            context: ./services/config-service
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-config:latest
          - service: auth-service
            context: ./services/auth-service
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-auth:latest
          - service: api-gateway
            context: ./services/api-gateway
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-gateway:latest
          - service: ai-agent
            context: ./services/ai-agent
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-ai-agent:latest
          - service: frontend
            context: ./services/frontend
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-frontend:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-hostinger:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            mkdir -p /opt/tradiepulse/infra/caddy /opt/tradiepulse/services/db/migrations
            cd /opt/tradiepulse

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            docker compose pull

            # Bring up stack
            docker compose up -d --remove-orphans
            docker compose ps
