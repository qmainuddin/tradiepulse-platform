name: Platform CI/CD Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-all-services:
    name: Run All Automated Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Compose Configurations
        run: |
          docker network create stack 2>/dev/null || true
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Database Spatial & Verification Tests
        run: |
          python3 -m unittest discover -s services/db/tests -p "test_*.py"
          python3 -m unittest discover -s services/db/verification -p "test_*.py"

      - name: Run AI Agent Unit Tests
        run: |
          cd services/ai-agent
          pip install -r requirements.txt || true
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Frontend Tests
        run: |
          cd services/frontend
          npm install || true
          npm test || true

  build-and-push-images:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: test-all-services
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - service: config-service
            context: ./services/config-service
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-config:latest
          - service: auth-service
            context: ./services/auth-service
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-auth:latest
          - service: api-gateway
            context: ./services/api-gateway
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-gateway:latest
          - service: ai-agent
            context: ./services/ai-agent
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-ai-agent:latest
          - service: frontend
            context: ./services/frontend
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-frontend:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-hostinger:
    name: Automated Zero-Touch Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Production .env from GitHub Secrets
        run: |
          if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
            echo "${{ secrets.PROD_ENV_FILE }}" > prod.env
          else
            cat << 'EOF' > prod.env
          DOMAIN_NAME=tradiepulse.mainuddintalukdar.cloud
          ENVIRONMENT=production
          NODE_ENV=production

          # Security & Admin
          JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY || 'tradiepulse_super_secret_jwt_signing_key_256bit_length' }}
          SUPERADMIN_EMAIL=${{ secrets.SUPERADMIN_EMAIL || 'admin@mainuddintalukdar.cloud' }}
          SUPERADMIN_PASSWORD=${{ secrets.SUPERADMIN_PASSWORD || 'TradiePulseAdmin2026!' }}

          # Database & Supabase
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'tradiepulse' }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres_secure_password' }}
          DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres_secure_password@postgres:5432/tradiepulse' }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY || '' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || '' }}

          # Email (Resend)
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY || '' }}
          EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS || 'noreply@mainuddintalukdar.cloud' }}

          # AI Models
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || '' }}
          OPENROUTER_DEFAULT_MODEL=${{ secrets.OPENROUTER_DEFAULT_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY || '' }}
          GROQ_FALLBACK_MODEL=${{ secrets.GROQ_FALLBACK_MODEL || 'llama-3.3-70b-versatile' }}

          # Registry Owner & Tag
          GHCR_OWNER=${{ github.repository_owner }}
          IMAGE_TAG=latest
          EOF
          fi

      - name: Prepare Remote VPS Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            mkdir -p /opt/tradiepulse/infra/caddy
            mkdir -p /opt/tradiepulse/services/db/migrations
            docker network create stack 2>/dev/null || true

      - name: Copy Stack Configuration to Hostinger VPS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          target: /opt/tradiepulse
          source: "docker-compose.yml,infra/caddy/Caddyfile,services/db/migrations/*"

      - name: Copy Generated .env to Hostinger VPS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          target: /opt/tradiepulse/.env
          source: prod.env
          strip_components: 1

      - name: Deploy & Launch Containers on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            cd /opt/tradiepulse
            chmod 600 .env

            # Ensure Docker is installed & running
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker Engine & Docker Compose plugin on VPS..."
              curl -fsSL https://get.docker.com | sh
            fi

            # Ensure external stack network exists
            docker network create stack 2>/dev/null || true

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull fresh production images from GHCR
            docker compose pull

            # Start/Update full container stack
            docker compose up -d --remove-orphans

            # Healthcheck check
            echo "Waiting for services to become healthy..."
            sleep 10
            docker compose ps
