name: Platform CI/CD Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-all-services:
    name: Run All Automated Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Compose Configurations
        run: |
          docker network create stack 2>/dev/null || true
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Database Spatial & Verification Tests
        run: |
          python3 -m unittest discover -s services/db/tests -p "test_*.py"
          python3 -m unittest discover -s services/db/verification -p "test_*.py"

      - name: Run AI Agent Unit Tests
        run: |
          cd services/ai-agent
          pip install -r requirements.txt || true
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Frontend Tests
        run: |
          cd services/frontend
          npm install || true
          npm test || true

  build-and-push-images:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: test-all-services
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - service: config-service
            context: ./services/config-service
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-config:latest
          - service: auth-service
            context: ./services/auth-service
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-auth:latest
          - service: api-gateway
            context: ./services/api-gateway
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-gateway:latest
          - service: ai-agent
            context: ./services/ai-agent
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-ai-agent:latest
          - service: frontend
            context: ./services/frontend
            image: ghcr.io/${{ github.repository_owner }}/tradiepulse-frontend:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-hostinger:
    name: Automated Zero-Touch Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Production .env from GitHub Secrets
        run: |
          if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
            echo "${{ secrets.PROD_ENV_FILE }}" > prod.env
          else
            cat << 'EOF' > prod.env
          DOMAIN_NAME=tradiepulse.mainuddintalukdar.cloud
          ENVIRONMENT=production
          NODE_ENV=production

          # Security & Admin
          JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY || 'tradiepulse_super_secret_jwt_signing_key_256bit_length' }}
          SUPERADMIN_EMAIL=${{ secrets.SUPERADMIN_EMAIL || 'admin@mainuddintalukdar.cloud' }}
          SUPERADMIN_PASSWORD=${{ secrets.SUPERADMIN_PASSWORD || 'TradiePulseAdmin2026!' }}

          # Modern Supabase Keys & JWKS URL
          SUPABASE_URL=${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || '' }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_KEY || '' }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL || '' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_KEY || '' }}

          # Database
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'tradiepulse' }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres_secure_password' }}
          DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres_secure_password@postgres:5432/tradiepulse' }}

          # Email (Resend)
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY || '' }}
          EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS || 'noreply@mainuddintalukdar.cloud' }}

          # AI Models
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || '' }}
          OPENROUTER_DEFAULT_MODEL=${{ secrets.OPENROUTER_DEFAULT_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY || '' }}
          GROQ_FALLBACK_MODEL=${{ secrets.GROQ_FALLBACK_MODEL || 'llama-3.3-70b-versatile' }}

          # Registry Owner & Tag
          GHCR_OWNER=${{ github.repository_owner }}
          IMAGE_TAG=latest
          EOF
          fi

      - name: Deploy to Hostinger VPS via Native OpenSSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Clean and trim input values
          SSH_HOST=$(echo "${SSH_HOST:-72.62.70.145}" | xargs)
          SSH_USER=$(echo "${SSH_USER:-root}" | xargs)
          SSH_PORT=$(echo "${SSH_PORT:-22}" | xargs)

          echo "Target Host: $SSH_USER@$SSH_HOST:$SSH_PORT"

          # Setup SSH Authentication
          if [ -n "$SSH_KEY" ]; then
            echo "Using SSH Private Key authentication..."
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_PREFIX="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -p $SSH_PORT -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST"
            SCP_PREFIX="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -P $SSH_PORT -i ~/.ssh/deploy_key"
          elif [ -n "$SSH_PASS" ]; then
            echo "Using SSH Password authentication via sshpass..."
            sudo apt-get update -y && sudo apt-get install -y sshpass
            SSH_PREFIX="sshpass -p '$SSH_PASS' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -p $SSH_PORT $SSH_USER@$SSH_HOST"
            SCP_PREFIX="sshpass -p '$SSH_PASS' scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -P $SSH_PORT"
          else
            echo "::error::Neither HOSTINGER_SSH_KEY nor HOSTINGER_SSH_PASSWORD secret is set in repository settings!"
            exit 1
          fi

          echo "==> Creating /opt/tradiepulse directory on VPS..."
          $SSH_PREFIX "mkdir -p /opt/tradiepulse/infra/caddy /opt/tradiepulse/services/db/migrations"

          echo "==> Transferring docker-compose, caddyfile, migrations, and .env to VPS..."
          $SCP_PREFIX docker-compose.yml "$SSH_USER@$SSH_HOST:/opt/tradiepulse/docker-compose.yml"
          $SCP_PREFIX infra/caddy/Caddyfile "$SSH_USER@$SSH_HOST:/opt/tradiepulse/infra/caddy/Caddyfile"
          $SCP_PREFIX -r services/db/migrations/* "$SSH_USER@$SSH_HOST:/opt/tradiepulse/services/db/migrations/"
          $SCP_PREFIX prod.env "$SSH_USER@$SSH_HOST:/opt/tradiepulse/.env"

          echo "==> Deploying and launching Docker containers on Hostinger VPS..."
          $SSH_PREFIX bash -c "'
            cd /opt/tradiepulse
            chmod 600 .env

            if ! command -v docker &> /dev/null; then
              echo \"Installing Docker Engine...\"
              curl -fsSL https://get.docker.com | sh
            fi

            docker network create stack 2>/dev/null || true

            echo \"$GH_TOKEN\" | docker login ghcr.io -u \"$GH_ACTOR\" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            
            echo \"=== TradiePulse Containers Status ===\"
            docker compose ps
          '"
