server:
  port: 8000

llm:
  provider: ${LLM_PROVIDER:openrouter}
  default-model: ${OPENROUTER_DEFAULT_MODEL:meta-llama/llama-3.3-70b-instruct:free}
  fallback-model: ${GROQ_FALLBACK_MODEL:llama-3.3-70b-versatile}
  max-tokens: 4096
  timeout-seconds: 30
  max-tool-calls: 5

cache:
  semantic-similarity-threshold: 0.92
  ttl-seconds: 86400

rag:
  top-k: 3
  score-threshold: 0.75
