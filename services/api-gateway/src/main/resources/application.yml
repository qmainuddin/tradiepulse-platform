server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/auth/**

        - id: ai-agent
          uri: ${AI_AGENT_SERVICE_URL:http://ai-agent:8000}
          predicates:
            - Path=/api/agent/**, /chat/**, /api/chat/**

        - id: config-service
          uri: ${CONFIG_SERVICE_URL:http://config-service:8888}
          predicates:
            - Path=/api/config/**
          filters:
            - StripPrefix=2

security:
  jwt:
    secret-key: ${JWT_SIGNING_KEY:change-me-to-a-secure-256-bit-secret-key-at-least-32-chars-long}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://tradiepulse.mainuddintalukdar.cloud,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
