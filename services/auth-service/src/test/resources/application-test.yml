spring:
  datasource:
    url: jdbc:h2:mem:tradiepulse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: PUBLIC

security:
  jwt:
    secret-key: test-secret-key-that-is-at-least-32-bytes-long-for-hmac256!
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  rate-limit:
    max-attempts: 5
    lockout-duration-minutes: 15
  activation:
    expiry-hours: 48

superadmin:
  email: test-admin@mainuddintalukdar.cloud
  password: super_secure_test_password_123!

resend:
  api-key: re_mock_test_key
  from-email: noreply@mainuddintalukdar.cloud

app:
  domain: localhost:3000
