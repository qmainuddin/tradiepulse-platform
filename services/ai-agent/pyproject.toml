[project]
name = "tradiepulse-ai-agent"
version = "1.0.0"
description = "Deterministic LangGraph Conversational AI Agent Core for TradiePulse"
authors = [{ name = "Mainuddin Talukdar", email = "mainuddin@mainuddintalukdar.cloud" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "aio-pika>=9.4.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
