name: tradiepulse

networks:
  tradiepulse-net:
    driver: bridge
  stack:
    external: true

volumes:
  pgdata:
  redisdata:
  qdrantdata:

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: tradiepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradiepulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradiepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  redis:
    image: redis:7.4-alpine
    container_name: tradiepulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tradiepulse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  qdrant:
    image: qdrant/qdrant:v1.11.2
    container_name: tradiepulse-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  config-service:
    image: ghcr.io/${GHCR_OWNER:-qmainuddin}/tradiepulse-config:${IMAGE_TAG:-latest}
    container_name: tradiepulse-config
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: native
      ENCRYPT_KEY: ${CONFIG_SERVER_ENCRYPT_KEY:-change-me-config-server-master-cipher-key-32c}
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  auth-service:
    image: ghcr.io/${GHCR_OWNER:-qmainuddin}/tradiepulse-auth:${IMAGE_TAG:-latest}
    container_name: tradiepulse-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradiepulse}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_KEY:-}}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@mainuddintalukdar.cloud}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-change-me-superadmin-secure-pwd-123!}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@mainuddintalukdar.cloud}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net
      - stack

  api-gateway:
    image: ghcr.io/${GHCR_OWNER:-qmainuddin}/tradiepulse-gateway:${IMAGE_TAG:-latest}
    container_name: tradiepulse-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_KEY:-}}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      AUTH_SERVICE_URL: http://auth-service:8081
      AI_AGENT_SERVICE_URL: http://ai-agent:8000
      CONFIG_SERVICE_URL: http://config-service:8888
      CORS_ALLOWED_ORIGINS: "https://${DOMAIN_NAME:-tradiepulse.mainuddintalukdar.cloud},http://localhost:3000"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net
      - stack

  ai-agent:
    image: ghcr.io/${GHCR_OWNER:-qmainuddin}/tradiepulse-ai-agent:${IMAGE_TAG:-latest}
    container_name: tradiepulse-ai-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-tradiepulse}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      QDRANT_URL: http://qdrant:6333
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_KEY:-}}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-llama-3.3-70b-versatile}
      LLM_PER_REQUEST_TOKEN_CEILING: ${LLM_PER_REQUEST_TOKEN_CEILING:-4096}
      LLM_MAX_TOOL_CALLS_PER_TURN: ${LLM_MAX_TOOL_CALLS_PER_TURN:-5}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net
      - stack

  frontend-shell:
    image: ghcr.io/${GHCR_OWNER:-qmainuddin}/tradiepulse-frontend:${IMAGE_TAG:-latest}
    container_name: tradiepulse-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: https://${DOMAIN_NAME:-tradiepulse.mainuddintalukdar.cloud}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net
      - stack
