name: tradiepulse-dev

networks:
  tradiepulse-net:
    driver: bridge

volumes:
  pgdata-dev:
  redisdata-dev:
  qdrantdata-dev:

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: tradiepulse-postgres-dev
    environment:
      POSTGRES_DB: tradiepulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./services/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradiepulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  redis:
    image: redis:7.2-alpine
    container_name: tradiepulse-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tradiepulse-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: tradiepulse-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata-dev:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradiepulse-net

  config-service:
    build:
      context: ./services/config-service
      dockerfile: Dockerfile
    container_name: tradiepulse-config-dev
    environment:
      SPRING_PROFILES_ACTIVE: native
      ENCRYPT_KEY: local-dev-config-server-master-cipher-key-32c
    ports:
      - "8888:8888"
    networks:
      - tradiepulse-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tradiepulse-auth-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/tradiepulse
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SIGNING_KEY: local-dev-jwt-signing-secret-key-32-chars-long
      SUPERADMIN_EMAIL: admin@mainuddintalukdar.cloud
      SUPERADMIN_PASSWORD: admin_dev_password_123!
      RESEND_API_KEY: re_mock_local_resend_api_key
    ports:
      - "8081:8081"
    networks:
      - tradiepulse-net

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: tradiepulse-gateway-dev
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SIGNING_KEY: local-dev-jwt-signing-secret-key-32-chars-long
      AUTH_SERVICE_URL: http://auth-service:8081
      AI_AGENT_SERVICE_URL: http://ai-agent:8000
      CONFIG_SERVICE_URL: http://config-service:8888
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8080:8080"
    networks:
      - tradiepulse-net

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    container_name: tradiepulse-ai-agent-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_password@postgres:5432/tradiepulse
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-sk-or-v1-mock-openrouter-key}
      OPENROUTER_DEFAULT_MODEL: meta-llama/llama-3.3-70b-instruct:free
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_mock_groq_api_key}
    ports:
      - "8000:8000"
    networks:
      - tradiepulse-net

  frontend-shell:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: tradiepulse-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - tradiepulse-net
